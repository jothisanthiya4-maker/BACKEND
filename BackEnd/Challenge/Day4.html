<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>

         
//Finding the first non repeating character in a word 

let word = "swiss" 

for(let i = 0; i < word.length; i++){

    let count = 0

    for(let j = 0; j < word.length; j++){

        if(word[i] == word[j]){
            count++
        }
    }

    if(count == 1){
        console.log("First nonrepeating character:", word[i])
        break
    }
}
    </script>
</body>
</html>
