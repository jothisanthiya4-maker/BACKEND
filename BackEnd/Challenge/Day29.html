<script>

    // 

    let arr=[2,3,1,55,34,67,7]

    for(let i=0;i<arr.length;i++){
        for(let j=i+1;j<arr.length;j++){
            if(arr[i]>arr[j]){
                let temp=arr[i]
                arr[i]=arr[j]
                arr[j]=temp
            }

        }
    }
    console.log(arr);
    console.log(`largest is : ${arr[arr.length-1]}`);
    console.log(`second largest is : ${arr[arr.length-2]}`);
    
    
</script>
