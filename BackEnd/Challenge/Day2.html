<!DOCTYPE html>

<body>
    

    <script>

// factors of number 

let number=24     
let factors=""    // empty string to store the factors

for(let a=1;a<=number;a++){
    if(24%a==0){              // to check whether number is divisible 
        factors= factors + a + " "   //if the remainder is 0 then the number is added to the factors
    }
}
console.log("factors : ",factors);   // finally printing all the factors of the given number 



    </script>
</body>
</html>
