<script>

    // Find the first number that occurs immediately after an even number.

let numbers = [3, 5, 8, 7, 4, 9, 6];

let found = false;

for (let i = 0; i < numbers.length - 1; i++) {

    if (numbers[i] % 2 === 0) {

        console.log("First number after an even number:", numbers[i + 1]);

        found = true;

        break;
    }
}

if (found === false) {
    console.log("Not found");
}
</script>
