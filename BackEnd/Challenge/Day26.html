<script>

// Number palindrome 

let number=121
let original = number
let reverse =0

while(number>0){
    let digit=number%10
    reverse= reverse*10 +digit
    number=(number-digit)/10
}

if(reverse==original){
    console.log("palindrome");
    
}
else{
    console.log("not a palindrome");
    
}


</script>
