<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 style="text-align: center;">Array Accessing</h1>
    <script>

        // TASK 1 – Student Names

let students = ["Arun", "Bala", "Kumar", "Ravi", "Priya"];

console.log(students[0]);
console.log(students[2]);
console.log(students[4]);


// TASK 2 – Product Prices

let prices = [1500, 2500, 3500, 4500, 5500];

let first = prices[0];
let last = prices[4];

let total = first + last;

console.log(total);


// TASK 3 – Find Array Value Using Index

let arr = ["HTML", "CSS", "JavaScript", "React", "Node"];

console.log(arr[2]);
console.log(arr[3]);
console.log(arr[arr.length - 1]);


// TASK 4 – Nested Array Access

let data = [
    ["Arun", 80],
    ["Bala", 75],
    ["Kumar", 90]
];

console.log(data[0][0]);
console.log(data[0][1]);
console.log(data[1][0]);
console.log(data[2][1]);


// TASK 5 – Logical Array Access

let numbers = [10, 20, 30, 40, 50];

let second = numbers[1];
let secondLast = numbers[numbers.length - 2];

let answer = second + secondLast;

console.log(answer);
    </script>
</body>
</html>
