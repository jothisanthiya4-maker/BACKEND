<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // adding using callback

        const adding=(a,b,cbf)=>{
            let result =a+b
            cbf(result)
        }

        adding(10,20,(ans)=>{
            console.log(ans);
            
        });

        // promise

        const checkNumber = (number) => {

    let promise = new Promise((resolve, reject) => {

        if(number > 10){
            resolve("Valid Number")
        }
        else{
            reject("Invalid Number")
        }

    })

    promise
    .then((result) => {
        console.log(result)
    })
    .catch((error) => {
        console.log(error)
    })
}

checkNumber(20)

// asyn await

const verifyNumber = async () => {

    try {
        let result = await checkNumber(20)
        console.log(result)
    }
    catch(error) {
        console.log(error)
    }

}

verifyNumber()
        



    </script>
</body>
</html>
